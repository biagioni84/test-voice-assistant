# Casos de prueba para scripts/eval.py. Herramienta de desarrollo: el script corre cada caso contra
# el LLM/RAG real (sin STT/mic) y vuelca todo a un archivo; el juicio de si pasó o no lo hace un humano
# (o Claude) leyendo el resultado, no hay pass/fail automático acá.
#
# Cada caso:
#   id:       nombre corto, único, sin espacios
#   note:     por qué existe este caso / qué bug prueba (opcional pero recomendado)
#   expect:   qué se espera que pase, en texto libre, para ayudar a juzgar (opcional)
#   type:     'rewrite' para probar SOLO voice/rewrite.py aislado (ver más abajo); si no está,
#             es un caso de pipeline completo (default)
#   split:    'dev' (default si no está) o 'validation'. Los casos 'dev' son los que se usaron para
#             ajustar el prompt/few-shot de voice/rewrite.py (cambio_de_dia_en_followup, etc.) --
#             sirven para no reintroducir un bug ya arreglado, pero NO miden generalización, porque
#             el prompt se ajustó mirando exactamente estos casos. Los 'validation' son holdout: se
#             escriben para tener formulaciones que NO se parezcan a ningún ejemplo few-shot de
#             voice/rewrite.py, y una vez agregados no se usan para seguir ajustando el prompt --
#             si fallan, se arregla el prompt de forma más general y se re-corre, no se agrega un
#             ejemplo few-shot calcado de ese caso puntual (eso sería hacer trampa).
#   turns:    lista de preguntas del usuario en orden (una charla; se resetea el historial entre casos)
#   variants: en vez de 'turns', varias formulaciones distintas del mismo caso (lista de listas de
#             turnos). Con temperature=0 (determinístico) repetir la MISMA pregunta no sirve para medir
#             nada -- 'variants' mide robustez a CÓMO se pregunta, no al muestreo aleatorio.
#
# Casos type: rewrite (prueban voice/rewrite.py sin pasar por RAG ni el LLM de respuesta):
#   history:  lista de [pregunta_usuario, respuesta_asistente] -- la charla previa
#   question: el turno a reescribir
#   expect:   cómo debería quedar la pregunta reescrita (texto libre, lo juzga un humano/Claude)

- id: rewrite_referencia_simple
  type: rewrite
  note: caso base -- resolver "y los sábados" usando el turno anterior
  expect: "¿A qué hora abre la oficina los sábados?' o equivalente"
  history:
    - ["¿A qué hora abre la oficina el domingo?", "La oficina no abre el domingo, está cerrada."]
  question: "y los sábados"

- id: rewrite_correccion_explicita
  type: rewrite
  note: >
    el caso que disparó todo esto -- el usuario corrige el día, la reescritura debe usar la
    corrección (sábado) y no lo que se venía hablando (domingo)
  expect: "¿A qué hora abre la oficina el sábado?' o equivalente, NO debe mencionar domingo"
  history:
    - ["¿A qué hora abre la oficina el domingo?", "La oficina no abre el domingo, está cerrada."]
  question: "Te pregunté el sábado a qué hora abre."

- id: rewrite_correccion_no
  type: rewrite
  note: variante de corrección con "No, ..." al principio
  expect: "¿A qué hora abre la oficina el sábado?' o equivalente"
  history:
    - ["¿A qué hora abre la oficina el domingo?", "La oficina no abre el domingo, está cerrada."]
  question: "No, te pregunté por el sábado."

- id: rewrite_cambio_de_tema_total
  type: rewrite
  note: >
    la pregunta ya es autónoma y no tiene nada que ver con el historial -- no debería
    "contaminarse" con el tema anterior (horarios)
  expect: "básicamente igual a la pregunta original, sobre restablecer la contraseña"
  history:
    - ["¿A qué hora abre la oficina los sábados?", "Los sábados abre de diez a una de la tarde."]
  question: "¿Cómo puedo restablecer la contraseña del correo?"

- id: rewrite_meta_pregunta_sobre_el_asistente
  type: rewrite
  note: >
    pregunta sobre el propio asistente (no sobre los documentos) -- no debería forzarse a hablar
    del tema anterior tampoco
  expect: "básicamente igual a la pregunta original, sobre por qué demora en responder"
  history:
    - ["¿A qué hora abre la oficina los sábados?", "Los sábados abre de diez a una de la tarde."]
  question: "¿Por qué demoras tanto en responder?"

- id: rewrite_referencia_dos_turnos_atras
  type: rewrite
  note: >
    RESULTADO AMBIGUO (22/09): dio "¿Y cuántos días dijiste que eran?" -- no resolvió la
    referencia. Pero el caso en sí es ambiguo (los dos turnos previos mencionan "días": veinte
    días de vacaciones Y dos días de trabajo remoto), así que no es una señal limpia de que
    rewrite.history_turns=2 no funcione -- habría que un caso menos ambiguo para confirmar esto.
  expect: "algo como '¿Cuántos días de vacaciones tengo por año?' -- debe volver al tema de vacaciones"
  history:
    - ["¿Cuántos días de vacaciones tengo por año?", "Tenés veinte días de vacaciones por año."]
    - ["¿Y el trabajo remoto?", "Está permitido dos días por semana."]
  question: "¿y cuántos días dije que eran?"

- id: rewrite_sujeto_elidido_sino
  type: rewrite
  note: >
    patrón general de sujeto elidido preservando el tipo sí/no -- formulación distinta del caso
    motivador real (oficina/"todos los días", ver README) para no sobreajustar al caso puntual.
  expect: >
    algo como "¿El soporte técnico atiende los fines de semana?" -- debe conservar "el soporte
    técnico" (no perderlo) Y seguir siendo una pregunta de sí/no (no "¿cuándo atiende...?")
  history:
    - ["¿El soporte técnico atiende de noche?", "No, solo en horario de oficina."]
  question: "los fines de semana"

- id: rewrite_afirmacion_como_confirmacion
  type: rewrite
  note: >
    afirmación sin "?" (en voz hablada, una confirmación de sí/no suena como afirmación con
    entonación) que debe convertirse en pregunta de confirmación, arrastrando el sujeto del
    historial -- formulación distinta del caso motivador.
  expect: "algo como '¿El wifi de invitados cambia la contraseña cada semana?'"
  history:
    - ["¿Cómo es el wifi de invitados?", "Se llama Invitados-Oficina y la contraseña cambia cada mes."]
  question: "Cambia la contraseña cada semana."

- id: rewrite_afirmacion_primer_turno
  type: rewrite
  note: >
    afirmación aislada en el PRIMER turno de la charla (sin historial) -- debe convertirse a
    pregunta igual, aunque no haya sujeto del historial para completarla.
  expect: "algo como '¿El estacionamiento tiene doce lugares?'"
  history: []
  question: "El estacionamiento tiene doce lugares."

- id: rewrite_decompose_no_trunca_json
  type: rewrite
  compound: true
  note: >
    regresión puntual a vigilar: LocalLLM._decompose() (voice/llm.py) NO debe recibir
    stop=["?", "\n"] -- ese stop es solo para la reescritura simple. El output de descomposición es
    un array JSON de sub-preguntas, cada una terminada en "?"; si el stop se aplicara acá, la
    decodificación cortaría en el PRIMER "?" del array (mitad de la primera sub-pregunta), el JSON
    quedaría inválido, parse_subquestions() devolvería None, y rewrite_query() caería a la pregunta
    original sin descomponer -- por eso expect_n_subquestions abajo es un chequeo AUTOMÁTICO
    (no juicio humano): si algún día se rompe, este caso falla con exit code != 0, no hay que leerlo.
  expect: "debe descomponerse en 2 sub-preguntas autónomas, no colapsar a 1 por un JSON cortado"
  expect_n_subquestions: 2
  history: []
  question: "¿Qué hago si la computadora no enciende y también cuántos días de vacaciones tengo?"

- id: horario_sabado_directo
  note: caso de control, pregunta simple con respuesta clara en oficina.md
  expect: "debe decir que abre de 10 a 13hs (o 'una de la tarde')"
  turns:
    - "¿A qué hora abre la oficina los sábados?"

- id: reset_password
  note: caso de control, pregunta simple con respuesta clara en soporte_tecnico.md
  expect: "debe mencionar la opción 'Olvidé mi contraseña' y el enlace al correo alternativo"
  turns:
    - "¿Cómo puedo restablecer la contraseña del correo?"

- id: pregunta_sin_contexto
  note: caso de control, no hay ningún documento que hable de esto
  expect: "debe admitir que no tiene esa información, no debe inventar una respuesta"
  turns:
    - "¿Cuántos empleados tiene la empresa?"

- id: followup_corto_mismo_tema
  note: >
    regresión del bug original de "y los follow-ups cortos no recuperan nada del RAG" (README).
    Antes lo resolvía el fallback de sticky-hits; después la reescritura de consulta vía LLM. Desde
    23/09, "y eso" puntualmente se resuelve con una regla determinista (voice/rewrite.py:
    is_empty_reference) en vez de llamar al LLM -- se encontró que el LLM era demasiado sensible a
    la redacción exacta de la respuesta anterior (que varía turno a turno) para este patrón
    puntual. Sigue pasando, ahora en 0ms.
  expect: "'y eso' debe seguir hablando de que el domingo está cerrado, sin contradecirse"
  turns:
    - "¿A qué hora abre la oficina el domingo?"
    - "y eso"

- id: cambio_de_dia_en_followup
  note: >
    FIJADO (22-23/09): con sticky-hits, 2/5 bien, 1/5 seguía hablando de domingo, 2/5 abstenían de
    más. Con la reescritura de consulta -- el LLM de respuesta ya no ve el historial, solo la
    pregunta reescrita + el CONTEXTO de este turno -- 5/5 responden bien sobre el sábado. El "y eso"
    del medio se resuelve en las 5 sin llamar al LLM (voice/rewrite.py: is_empty_reference, ver
    README sección de latencia -- el LLM era frágil a la redacción exacta de la respuesta anterior).
  expect: "debe responder específicamente sobre el sábado (10 a 13hs), no repetir lo del domingo"
  variants:
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "Te pregunté el sábado a qué hora abre."]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "¿Y los sábados?"]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "Perdón, pregunté por el sábado."]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "¿Cuál es el horario del sábado?"]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "No, te pregunté por el sábado."]

- id: comentario_sin_tema_no_corta_continuidad
  note: >
    regresión del bug de "expandir con el tema equivocado" — un comentario sin tema en medio de la
    charla no debe hacer que se pierda el contexto real para el siguiente follow-up corto. La
    reescritura de consulta lo resuelve bien. Había un near-miss real acá (el turno del medio traía
    soporte_tecnico.md con coseno 0.36, apenas sobre el viejo umbral 0.35) -- FIJADO (23/09) con el
    reranker: ese mismo chunk puntúa -3.22 en la escala del reranker, muy por debajo de min_score=0.0.
    Los 3 turnos pasan limpio ahora.
  expect: "el último turno debe volver a hablar del horario de sábados, no inventar 'oficina de soporte técnico'"
  turns:
    - "¿A qué hora abre la oficina los sábados?"
    - "¿Por qué demoras tanto en responder?"
    - "y los sábados"

- id: identidad_inventada
  note: >
    FIJADO (22/09): "Juan Carlos" no aparece en ningún documento; el modelo usaba conocimiento
    general del mundo real (Juan Carlos I, rey de España). La abstención determinista
    (voice/guardrails.py) corta esto sin llamar al LLM. 5/5 variantes pasan ahora, siempre con la
    misma respuesta fija.
  expect: "debe decir que no tiene información sobre esa persona, siempre con la misma respuesta"
  variants:
    - ["¿Quién es Juan Carlos?"]
    - ["¿Vos conocés a Juan Carlos?"]
    - ["Decime quién es Juan Carlos."]
    - ["¿Sabés algo de Juan Carlos?"]
    - ["¿Quién es este tal Juan Carlos?"]

- id: identidad_inventada_nombre_comun
  note: >
    FIJADO (22/09): 3/3 pasan con la abstención determinista (antes 2/3, con la variante restante
    inventando una actriz). La fama del nombre real ya no importa: ninguna llega a generarse con
    el LLM.
  expect: "debe admitir que no conoce a esa persona, siempre con la misma respuesta"
  variants:
    - ["¿Quién es María Fernández?"]
    - ["¿Conocés a María Fernández?"]
    - ["Decime quién es María Fernández."]

- id: identidad_inventada_multiturn
  note: >
    FIJADO (22/09): versión conversación completa (sin el error de STT que la disparó originalmente,
    ver README). Antes escalaba con cada insistencia (llegaba a inventar que "el jefe directo de
    Juan Carlos era Felipe VI"); ahora los 3 turnos responden consistentemente con la abstención fija.
  expect: "en algún punto debería reconocer que no sabe de quién se habla, no seguir afirmando 'Juan Carlos es el jefe directo'"
  turns:
    - "¿Quién es Juan Carlos?"
    - "¿el jefe directo de quién?"
    - "¿Pero el jefe directo de quién?"

- id: chiste_generico
  note: >
    FIJADO (22/09): antes el remate salía en chino 2/5 veces (Qwen es un modelo entrenado por un
    lab chino). El logit_bias que penaliza tokens CJK (voice/guardrails.py) dio 5/5 en español
    limpio.
  expect: "debe responder con un chiste corto, todo en español, sin forzar contenido de los documentos"
  variants:
    - ["Contame un chiste corto."]
    - ["Decime un chiste gracioso."]
    - ["¿Sabés algún chiste?"]
    - ["Tirame un chiste."]
    - ["Hacéme reír con un chiste."]

- id: vacaciones
  note: caso de control, contenido de recursos_humanos.md (todavía no cubierto en los casos anteriores)
  expect: "debe mencionar 20 días hábiles por año y que se piden con 15 días de anticipación"
  turns:
    - "¿Cuántos días de vacaciones tengo por año?"

- id: trabajo_remoto
  note: caso de control, más contenido de recursos_humanos.md
  expect: "debe decir 2 días por semana, y que martes/jueves son de presencia obligatoria"
  turns:
    - "¿Puedo trabajar todos los días desde casa?"

- id: retrieval_ambiguo_dos_docs
  note: >
    MEJORADO CON RERANKER (23/09, ver README): originalmente 3/3 alucinaban mezclando 2 docs. Con el
    reranker (jina-reranker-v2-base-multilingual) + min_score=0.0 recalibrado: variantes 1 y 2 ahora
    ABSTIENEN honestamente (ningún doc puntúa positivo -- más seguro que forzar una aclaración). La
    variante 3 recupera 1 solo doc correcto (ya no mezcla), pero el LLM lo malinterpreta (invierte
    qué días son de presencia obligatoria) -- eso es "bug A" puro, no algo que retrieval pueda
    arreglar. El gate de ambigüedad (ambiguous_docs) casi no llega a intervenir en estos 3 casos con
    el reranker: al filtrar primero por min_score, rara vez quedan 2 candidatos parejos Y ambos
    positivos a la vez -- se resuelven antes, por abstención o por un solo candidato claro.
  expect: "no debería inventar una política que mezcle las dos cosas"
  variants:
    - ["¿Puedo trabajar desde casa los sábados?"]
    - ["¿El sábado puedo hacer home office?"]
    - ["¿Está permitido trabajar remoto los sábados?"]

- id: pregunta_repetida_consistencia
  note: >
    la misma pregunta dos veces seguidas en la misma conversación — no debería contradecirse
    a sí mismo de un turno al otro
  expect: "la segunda respuesta debe decir lo mismo que la primera"
  turns:
    - "¿A qué hora abre la oficina los sábados?"
    - "¿A qué hora abre la oficina los sábados?"

- id: grosero_smalltalk
  note: >
    manejo de un comentario grosero/casual sin relación a los documentos (pasó en una charla
    real con el asistente) — no debería intentar forzar contenido de los docs ni responder raro
  expect: "una respuesta corta y neutra, sin inventar nada ni citar documentos"
  turns:
    - "Sos un inútil."

- id: negacion_confirmacion
  note: pregunta formulada como confirmación de una negación, para ver si se confunde con el "no"
  expect: "debe confirmar que sí, está cerrada los domingos (no negar la negación por error)"
  turns:
    - "La oficina no abre los domingos, ¿verdad?"

- id: correccion_de_premisa
  note: >
    pregunta de sí/no con una premisa incorrecta (el doc dice "Invitados-Oficina", no
    "Red-Oficina") -- debe corregir la premisa con el dato correcto, no solo confirmar/negar sin
    explicar ni abstener. NO se ajusta el umbral para este caso puntual (ver README) -- si el
    retrieval no encuentra el chunk, se documenta como evidencia para BM25/cambio de modelo, no se
    fuerza bajando min_score.
  expect: "debe decir que el wifi se llama Invitados-Oficina, no Red-Oficina (corrige, no solo niega)"
  turns:
    - "¿El wifi de invitados se llama Red-Oficina?"

- id: pregunta_compuesta
  compound: true
  note: >
    dos preguntas en un mismo turno, sobre el mismo documento. Con el reranker (23/09, ver README):
    REGRESIÓN nueva pero reveladora -- el chunk correcto (tiene las dos partes de la respuesta)
    puntúa -0.66 con el reranker para esta frase imperativa/compuesta ("Decime X y también Y"), por
    debajo de min_score=0.0, así que ahora abstiene en vez de responder (antes, por casualidad del
    coseno, respondía bien). No es un problema de umbral: es exactamente el caso que motivó separar
    "pregunta compuesta" (dos datos, un tema) de "pregunta ambigua" (un dato, dos fuentes en
    conflicto) descomponiendo en sub-preguntas antes del retrieval (punto 4, ver README) en vez de
    mandar la pregunta compuesta tal cual. FIJADO con la descomposición: cada mitad se retrieval-ea
    por separado, así que el reranker nunca ve la frase compuesta completa.
  expect: "debe responder ambas partes: horario de lunes a viernes Y de sábados"
  turns:
    - "Decime el horario de lunes a viernes y también el de los sábados."

# ============================================================================
# VALIDACIÓN (holdout): formulaciones que NO se parecen a ningún ejemplo few-shot
# de voice/rewrite.py, agregadas después de terminar de ajustar el prompt. No se
# tocan para "hacer pasar" un caso puntual -- si fallan, el prompt se arregla de
# forma general (o se documenta como límite conocido), no a medida de estos casos.
# ============================================================================

- id: validation_ahi
  split: validation
  note: >
    continuación vaga con "ahí" en vez de "eso" (el few-shot usa "eso"/"y los sábados", nunca
    "¿y ahí?") + una corrección con una formulación distinta a "Te pregunté X"/"No, X"
  expect: "el último turno debe responder sobre el sábado (10-13hs), no domingo"
  turns:
    - "¿A qué hora abre la oficina el domingo?"
    - "¿y ahí?"
    - "Ah, me refería al sábado."

- id: validation_lo_mismo_para_x
  split: validation
  note: patrón "lo mismo pero para X", no usado en ningún few-shot
  expect: "debe dar el horario del sábado (10-13hs), no repetir el del domingo"
  turns:
    - "¿A qué hora abre la oficina el domingo?"
    - "¿Y lo mismo pero para el sábado?"

- id: validation_dale_y_el_otro
  split: validation
  note: otra formulación vaga de continuación, con muletilla ("dale") no usada en ningún few-shot
  expect: "debe dar el horario del sábado (10-13hs)"
  turns:
    - "¿A qué hora abre la oficina el domingo?"
    - "dale, ¿y el otro día que te dije?"

- id: validation_correccion_indirecta
  split: validation
  note: >
    corrección sin usar "no" ni "te pregunté" (los dos patrones que sí cubren los few-shot de
    corrección) -- una forma más indirecta de corregir
  expect: "debe dar el horario del sábado (10-13hs), no domingo"
  turns:
    - "¿A qué hora abre la oficina el domingo?"
    - "Uy perdón, quise decir el sábado."

# ============================================================================
# VALIDACIÓN -- descomposición de preguntas compuestas (punto 4). Formulaciones que NO se parecen
# a los ejemplos few-shot de voice/rewrite.py:_DECOMPOSE_EXAMPLES (a propósito: agregar un caso
# calcado de un few-shot no prueba generalización, sería "hacer trampa" -- mismo criterio que el
# resto de la sección validation de arriba).
# ============================================================================

- id: validation_compuesta_primer_turno
  compound: true
  split: validation
  note: >
    compuesta desde el PRIMER turno de la charla, sin historial -- el caso que corrige el diseño
    original (que gateaba toda la descomposición detrás de "if not self.history").
  expect: "debe responder las dos partes: horario de lunes a viernes Y cómo restablecer la contraseña"
  turns:
    - "¿Cuál es el horario de la oficina de lunes a viernes y cómo puedo restablecer la contraseña del correo?"

- id: validation_compuesta_followup
  compound: true
  split: validation
  note: >
    compuesta como turno de seguimiento, después de un turno previo sobre un tema distinto -- prueba
    que la descomposición no se confunda con el historial de un tema que no tiene nada que ver.
  expect: "el último turno debe responder cuándo se pagan los sueldos Y cuántos días de vacaciones, sin mezclar el horario de sábados del turno anterior"
  turns:
    - "¿A qué hora abre la oficina los sábados?"
    - "Y aparte, ¿cuándo se pagan los sueldos y cuántos días de vacaciones tengo?"

- id: validation_compuesta_parte_fuera_de_dominio
  compound: true
  split: validation
  note: >
    una parte tiene respuesta en los documentos, la otra no tiene nada que ver -- la parte
    resuelta debe responderse normalmente y la otra debe abstener con una nota fija, sin que una
    contamine a la otra (ni alucinar la segunda ni abstener de más en la primera).
  expect: "debe dar el horario de sábados Y decir que no tiene información sobre la capital de Francia (nota fija, sin alucinar)"
  turns:
    - "¿Cuál es el horario de la oficina los sábados y cuál es la capital de Francia?"

- id: validation_compuesta_imperativa
  compound: true
  split: validation
  note: >
    fraseo imperativo distinto al del few-shot ("Decime X y también Y") -- usa "Contame"/"de paso
    decime" en vez de esas palabras exactas, para probar que la normalización a interrogativas
    generaliza y no fue memorizada.
  expect: "debe responder el horario del sábado Y qué hacer si la computadora no enciende"
  turns:
    - "Contame el horario del sábado y de paso decime qué hago si la computadora no enciende."

- id: validation_sujeto_elidido_y_afirmacion
  split: validation
  note: >
    conversación REAL que disparó los bugs 1-3 en una prueba en vivo (23/09, ver README): el
    reescritor perdía "la oficina" al resolver "todos los días" (cambiando además sí/no por
    qué/cuándo), no convertía la afirmación final (sin "?") en pregunta, y el re-agregado de "?"
    corrompía texto que ya terminaba en "." (salía "...mañana.?"). Se agrega tal cual se dio, como
    holdout -- no se tocaron few-shots calcados de esta conversación puntual (los que se agregaron
    usan otros temas, ver rewrite_sujeto_elidido_sino/rewrite_afirmacion_como_confirmacion).
    RESULTADO PARCIAL, documentado a propósito en vez de forzarlo con un few-shot calcado: turnos
    1-2 preservan "la oficina" y el tipo sí/no de forma confiable (se probó con varios temas
    distintos: wifi, sala de reuniones, estacionamiento, todos generalizan bien). El turno 3 (una
    oración YA gramaticalmente completa -- "Y todos los días abre a las 10 de la mañana" -- sin
    ninguna palabra que remita explícitamente al sujeto) sigue perdiendo "la oficina" en la mayoría
    de las corridas, un límite real del 3B que se repite con otros temas equivalentes (p.ej. "sala
    Sur"), no algo puntual de esta conversación. Lo importante: el sistema degrada SEGURO en ese
    caso (abstiene honestamente "no lo encontré, ¿me lo preguntás de otra forma?"), no alucina ni
    produce texto corrupto -- eso sí quedó arreglado del todo.
  expect: >
    turnos 1 y 2 deben seguir hablando de LA OFICINA preservando sí/no, con corrección de premisa
    ("no, abre de lunes a viernes" o similar) en vez de una simple confirmación; el turno 3 puede
    abstener honestamente ("no lo encontré...") si no preservó el sujeto -- NO debe alucinar ni
    producir texto con puntuación corrupta (tipo "...mañana.?")
  turns:
    - "¿Qué hora abre la oficina?"
    - "todos los días"
    - "Y todos los días abre a las 10 de la mañana."

