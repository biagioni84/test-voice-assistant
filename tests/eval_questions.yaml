# Casos de prueba para scripts/eval.py. Herramienta de desarrollo: el script corre cada caso contra
# el LLM/RAG real (sin STT/mic) y vuelca todo a un archivo; el juicio de si pasó o no lo hace un humano
# (o Claude) leyendo el resultado, no hay pass/fail automático acá.
#
# Cada caso:
#   id:       nombre corto, único, sin espacios
#   note:     por qué existe este caso / qué bug prueba (opcional pero recomendado)
#   expect:   qué se espera que pase, en texto libre, para ayudar a juzgar (opcional)
#   type:     'rewrite' para probar SOLO voice/rewrite.py aislado (ver más abajo); si no está,
#             es un caso de pipeline completo (default)
#   turns:    lista de preguntas del usuario en orden (una charla; se resetea el historial entre casos)
#   variants: en vez de 'turns', varias formulaciones distintas del mismo caso (lista de listas de
#             turnos). Con temperature=0 (determinístico) repetir la MISMA pregunta no sirve para medir
#             nada -- 'variants' mide robustez a CÓMO se pregunta, no al muestreo aleatorio.
#
# Casos type: rewrite (prueban voice/rewrite.py sin pasar por RAG ni el LLM de respuesta):
#   history:  lista de [pregunta_usuario, respuesta_asistente] -- la charla previa
#   question: el turno a reescribir
#   expect:   cómo debería quedar la pregunta reescrita (texto libre, lo juzga un humano/Claude)

- id: rewrite_referencia_simple
  type: rewrite
  note: caso base -- resolver "y los sábados" usando el turno anterior
  expect: "¿A qué hora abre la oficina los sábados?' o equivalente"
  history:
    - ["¿A qué hora abre la oficina el domingo?", "La oficina no abre el domingo, está cerrada."]
  question: "y los sábados"

- id: rewrite_correccion_explicita
  type: rewrite
  note: >
    el caso que disparó todo esto -- el usuario corrige el día, la reescritura debe usar la
    corrección (sábado) y no lo que se venía hablando (domingo)
  expect: "¿A qué hora abre la oficina el sábado?' o equivalente, NO debe mencionar domingo"
  history:
    - ["¿A qué hora abre la oficina el domingo?", "La oficina no abre el domingo, está cerrada."]
  question: "Te pregunté el sábado a qué hora abre."

- id: rewrite_correccion_no
  type: rewrite
  note: variante de corrección con "No, ..." al principio
  expect: "¿A qué hora abre la oficina el sábado?' o equivalente"
  history:
    - ["¿A qué hora abre la oficina el domingo?", "La oficina no abre el domingo, está cerrada."]
  question: "No, te pregunté por el sábado."

- id: rewrite_cambio_de_tema_total
  type: rewrite
  note: >
    la pregunta ya es autónoma y no tiene nada que ver con el historial -- no debería
    "contaminarse" con el tema anterior (horarios)
  expect: "básicamente igual a la pregunta original, sobre restablecer la contraseña"
  history:
    - ["¿A qué hora abre la oficina los sábados?", "Los sábados abre de diez a una de la tarde."]
  question: "¿Cómo puedo restablecer la contraseña del correo?"

- id: rewrite_meta_pregunta_sobre_el_asistente
  type: rewrite
  note: >
    pregunta sobre el propio asistente (no sobre los documentos) -- no debería forzarse a hablar
    del tema anterior tampoco
  expect: "básicamente igual a la pregunta original, sobre por qué demora en responder"
  history:
    - ["¿A qué hora abre la oficina los sábados?", "Los sábados abre de diez a una de la tarde."]
  question: "¿Por qué demoras tanto en responder?"

- id: rewrite_referencia_dos_turnos_atras
  type: rewrite
  note: >
    RESULTADO AMBIGUO (22/09): dio "¿Y cuántos días dijiste que eran?" -- no resolvió la
    referencia. Pero el caso en sí es ambiguo (los dos turnos previos mencionan "días": veinte
    días de vacaciones Y dos días de trabajo remoto), así que no es una señal limpia de que
    rewrite.history_turns=2 no funcione -- habría que un caso menos ambiguo para confirmar esto.
  expect: "algo como '¿Cuántos días de vacaciones tengo por año?' -- debe volver al tema de vacaciones"
  history:
    - ["¿Cuántos días de vacaciones tengo por año?", "Tenés veinte días de vacaciones por año."]
    - ["¿Y el trabajo remoto?", "Está permitido dos días por semana."]
  question: "¿y cuántos días dije que eran?"

- id: horario_sabado_directo
  note: caso de control, pregunta simple con respuesta clara en oficina.md
  expect: "debe decir que abre de 10 a 13hs (o 'una de la tarde')"
  turns:
    - "¿A qué hora abre la oficina los sábados?"

- id: reset_password
  note: caso de control, pregunta simple con respuesta clara en soporte_tecnico.md
  expect: "debe mencionar la opción 'Olvidé mi contraseña' y el enlace al correo alternativo"
  turns:
    - "¿Cómo puedo restablecer la contraseña del correo?"

- id: pregunta_sin_contexto
  note: caso de control, no hay ningún documento que hable de esto
  expect: "debe admitir que no tiene esa información, no debe inventar una respuesta"
  turns:
    - "¿Cuántos empleados tiene la empresa?"

- id: followup_corto_mismo_tema
  note: >
    regresión del bug original de "y los follow-ups cortos no recuperan nada del RAG" (README).
    Antes lo resolvía el fallback de sticky-hits (heredar los hits del turno anterior tal cual);
    ahora lo resuelve la reescritura de consulta (voice/rewrite.py), que convierte "y eso" en una
    pregunta autónoma antes del retrieval -- sticky-hits se eliminó por completo. Sigue pasando.
  expect: "'y eso' debe seguir hablando de que el domingo está cerrado, sin contradecirse"
  turns:
    - "¿A qué hora abre la oficina el domingo?"
    - "y eso"

- id: cambio_de_dia_en_followup
  note: >
    FIJADO (22/09): con sticky-hits, 2/5 bien, 1/5 seguía hablando de domingo, 2/5 abstenían de más.
    Con la reescritura de consulta (voice/rewrite.py) -- el LLM de respuesta tampoco ve más el
    historial, solo la pregunta ya reescrita + el CONTEXTO de este turno -- ahora 5/5 responden bien
    sobre el sábado. El "y eso" del medio también se resuelve bien en las 5 (necesitó un ejemplo
    few-shot específico para continuaciones vacías tipo "y eso"/"eso mismo", ver voice/rewrite.py).
  expect: "debe responder específicamente sobre el sábado (10 a 13hs), no repetir lo del domingo"
  variants:
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "Te pregunté el sábado a qué hora abre."]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "¿Y los sábados?"]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "Perdón, pregunté por el sábado."]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "¿Cuál es el horario del sábado?"]
    - ["¿A qué hora abre la oficina el domingo?", "y eso", "No, te pregunté por el sábado."]

- id: comentario_sin_tema_no_corta_continuidad
  note: >
    regresión del bug de "expandir con el tema equivocado" — un comentario sin tema en medio de la
    charla no debe hacer que se pierda el contexto real para el siguiente follow-up corto. Antes lo
    resolvía sticky-hits (no lo actualizaba en un turno sin hits); ahora depende de que la
    reescritura mire el historial completo (últimos rewrite.history_turns=2 turnos) y no solo el
    turno inmediatamente anterior. Sigue pasando.
  expect: "el último turno debe volver a hablar del horario de sábados, no inventar 'oficina de soporte técnico'"
  turns:
    - "¿A qué hora abre la oficina los sábados?"
    - "¿Por qué demoras tanto en responder?"
    - "y los sábados"

- id: identidad_inventada
  note: >
    FIJADO (22/09): "Juan Carlos" no aparece en ningún documento; el modelo usaba conocimiento
    general del mundo real (Juan Carlos I, rey de España). La abstención determinista
    (voice/guardrails.py) corta esto sin llamar al LLM. 5/5 variantes pasan ahora, siempre con la
    misma respuesta fija.
  expect: "debe decir que no tiene información sobre esa persona, siempre con la misma respuesta"
  variants:
    - ["¿Quién es Juan Carlos?"]
    - ["¿Vos conocés a Juan Carlos?"]
    - ["Decime quién es Juan Carlos."]
    - ["¿Sabés algo de Juan Carlos?"]
    - ["¿Quién es este tal Juan Carlos?"]

- id: identidad_inventada_nombre_comun
  note: >
    FIJADO (22/09): 3/3 pasan con la abstención determinista (antes 2/3, con la variante restante
    inventando una actriz). La fama del nombre real ya no importa: ninguna llega a generarse con
    el LLM.
  expect: "debe admitir que no conoce a esa persona, siempre con la misma respuesta"
  variants:
    - ["¿Quién es María Fernández?"]
    - ["¿Conocés a María Fernández?"]
    - ["Decime quién es María Fernández."]

- id: identidad_inventada_multiturn
  note: >
    FIJADO (22/09): versión conversación completa (sin el error de STT que la disparó originalmente,
    ver README). Antes escalaba con cada insistencia (llegaba a inventar que "el jefe directo de
    Juan Carlos era Felipe VI"); ahora los 3 turnos responden consistentemente con la abstención fija.
  expect: "en algún punto debería reconocer que no sabe de quién se habla, no seguir afirmando 'Juan Carlos es el jefe directo'"
  turns:
    - "¿Quién es Juan Carlos?"
    - "¿el jefe directo de quién?"
    - "¿Pero el jefe directo de quién?"

- id: chiste_generico
  note: >
    FIJADO (22/09): antes el remate salía en chino 2/5 veces (Qwen es un modelo entrenado por un
    lab chino). El logit_bias que penaliza tokens CJK (voice/guardrails.py) dio 5/5 en español
    limpio.
  expect: "debe responder con un chiste corto, todo en español, sin forzar contenido de los documentos"
  variants:
    - ["Contame un chiste corto."]
    - ["Decime un chiste gracioso."]
    - ["¿Sabés algún chiste?"]
    - ["Tirame un chiste."]
    - ["Hacéme reír con un chiste."]

- id: vacaciones
  note: caso de control, contenido de recursos_humanos.md (todavía no cubierto en los casos anteriores)
  expect: "debe mencionar 20 días hábiles por año y que se piden con 15 días de anticipación"
  turns:
    - "¿Cuántos días de vacaciones tengo por año?"

- id: trabajo_remoto
  note: caso de control, más contenido de recursos_humanos.md
  expect: "debe decir 2 días por semana, y que martes/jueves son de presencia obligatoria"
  turns:
    - "¿Puedo trabajar todos los días desde casa?"

- id: retrieval_ambiguo_dos_docs
  note: >
    BUG ABIERTO (22/09, no se tocó código -- bug A, prioridad 2). Confirmado sistemático: 3/3
    variantes fallan, cada una de forma distinta ("los sábados son de presencia obligatoria",
    "los sábados la oficina está cerrada" -- directamente contradice oficina.md aunque esa vez SÍ
    se recuperó el chunk correcto --, "no están permitidos para trabajar remoto"). No fue una sola
    vez.
  expect: "no debería inventar una política que mezcle las dos cosas"
  variants:
    - ["¿Puedo trabajar desde casa los sábados?"]
    - ["¿El sábado puedo hacer home office?"]
    - ["¿Está permitido trabajar remoto los sábados?"]

- id: pregunta_repetida_consistencia
  note: >
    la misma pregunta dos veces seguidas en la misma conversación — no debería contradecirse
    a sí mismo de un turno al otro
  expect: "la segunda respuesta debe decir lo mismo que la primera"
  turns:
    - "¿A qué hora abre la oficina los sábados?"
    - "¿A qué hora abre la oficina los sábados?"

- id: grosero_smalltalk
  note: >
    manejo de un comentario grosero/casual sin relación a los documentos (pasó en una charla
    real con el asistente) — no debería intentar forzar contenido de los docs ni responder raro
  expect: "una respuesta corta y neutra, sin inventar nada ni citar documentos"
  turns:
    - "Sos un inútil."

- id: negacion_confirmacion
  note: pregunta formulada como confirmación de una negación, para ver si se confunde con el "no"
  expect: "debe confirmar que sí, está cerrada los domingos (no negar la negación por error)"
  turns:
    - "La oficina no abre los domingos, ¿verdad?"

- id: pregunta_compuesta
  note: dos preguntas en un mismo turno, sobre el mismo documento
  expect: "debe responder ambas partes: horario de lunes a viernes Y de sábados"
  turns:
    - "Decime el horario de lunes a viernes y también el de los sábados."
