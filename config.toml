# Configuración del asistente de voz local.
# Presupuesto de hardware objetivo: RTX 3050 4GB VRAM / 31GB RAM / i5-12450H (12 hilos).

[audio]
sample_rate = 16000        # lo que esperan wake word, VAD y Whisper
# mic_name = ""            # substring del nombre del micrófono; vacío = default de PulseAudio
# speaker_name = ""

[wakeword]
enabled = true
model = "hey_jarvis"       # preentrenados de openWakeWord: hey_jarvis, alexa, hey_mycroft, hey_rhasspy
threshold = 0.5
vad_threshold = 0.5        # exige voz real (Silero) además del score del wake word; baja falsos positivos
noise_suppression = true   # SpeexDSP, barato; ayuda contra ruido de fondo estacionario (p.ej. fan de la Orin)

[vad]
speech_threshold = 0.5     # prob. de Silero para considerar voz
end_silence_ms = 900       # silencio que marca fin de frase
min_speech_ms = 250        # menos que esto se descarta (ruido)
no_speech_timeout_s = 6.0  # tras el wake word, si nadie habla, vuelve a IDLE
max_utterance_s = 20.0
followup_s = 5.0           # ventana de conversación sin repetir wake word (0 = desactivar)

[stt]
model = "turbo"            # large-v3-turbo
device = "cuda"
compute_type = "int8_float16"   # ~1GB VRAM. Alternativa: "float16" (~1.6GB) o device="cpu"+"int8"
language = "es"
beam_size = 1

[rag]
enabled = true
docs_dir = "docs"
embed_model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
top_k = 2
chunk_chars = 500           # tope para partir un párrafo gigante; NO se usa para combinar párrafos
                            # distintos entre sí (un chunk = un párrafo = un hecho, ver README)

# Retrieval híbrido (denso + BM25 léxico, fusionados por RRF) -- ver voice/rag.py. Arquitectura,
# no calibración: rrf_k=60 es la constante estándar del paper de RRF, no se ajusta contra docs
# puntuales. bm25_candidates sí puede subirse con corpus más grandes.
hybrid_enabled = true
bm25_candidates = 5
rrf_k = 60

# Reranker cross-encoder (voice/rag.py): el primer filtro (denso o híbrido de arriba) trae los
# reranker_candidates mejores candidatos; el reranker los reordena con un juicio de relevancia más
# fino, y ESE score (logit crudo, no 0-1) es el que se compara contra min_score y
# ambiguity_threshold de acá abajo.
reranker_enabled = true
reranker_model = "jinaai/jina-reranker-v2-base-multilingual"
reranker_candidates = 5

# PROVISORIO, atado a los documentos genéricos de docs/ -- ver README "parámetros calibrados vs.
# arquitectura estable". Estos son solo el FALLBACK: si existe calibration.toml (generado por
# `python scripts/calibrate.py` contra tests/calibration_questions.yaml) lo pisa (ver
# voice/config.py: _apply_calibration). No los edites a mano pensando que van a tener efecto una
# vez que calibration.toml exista -- volvé a correr calibrate.py en cambio. Valores acá: el default
# documentado para un checkout nuevo sin calibración corrida todavía.
min_score = 0.0             # bajo este score del reranker no se inyecta contexto
# gate_docs() (voice/guardrails.py, rediseñado 24/09 -- ver README): cercanía de scores entre dos
# documentos NO implica ambigüedad por sí sola, pueden ser complementarios. confidence_margin
# decide primero si el top-1 "domina con claridad" (min_score + confidence_margin): si sí, el
# CONTEXTO se restringe a SOLO ese documento (evita mezclar políticas sin tener que preguntar).
# Solo si NINGÚN doc tiene confianza alta Y los dos mejores (de documentos distintos) están a
# menos de ambiguity_threshold, se pide aclaración.
confidence_margin = 0.8     # PROVISORIO -- sin suficientes casos de ambigüedad genuina en este
                            # corpus chico para calibrar con scripts/calibrate.py; revisar cuando
                            # haya documentos reales con temas que sí se solapen de verdad.
ambiguity_threshold = 0.5   # si los 2 docs con mejor score (ninguno con confianza alta) están a
                            # menos que esto, se pide aclaración en vez de generar.

[rag.doc_topics]            # nombres de tema para el mensaje de aclaración del gate -- legibles
                            # para voz (sin siglas, sin puntuación doble: pasan por
                            # guardrails.lint_for_voice, ver README). NO son títulos de archivo.
"oficina.md" = "horarios y logística de oficina"
"recursos_humanos.md" = "políticas de recursos humanos"
"soporte_tecnico.md" = "soporte técnico"

[llm]
# Medido con scripts/bench.py en esta máquina (llama-cpp-python COMPILADO con CUDA, ver README):
#   gpu_layers=0  (CPU puro): ~5.2 tok/s,  fin de voz->1er audio ~5.7s  (lo que sentiste "muy lento")
#   gpu_layers=20 (parcial):  ~15.4 tok/s, fin de voz->1er audio ~1.9s, VRAM ~2.9/4.0GB (margen ~1.1GB)
#   gpu_layers=28 (parcial):  ~20.9 tok/s, fin de voz->1er audio ~2.0s, VRAM ~3.3/4.0GB (margen ~0.7GB) <- default
#   gpu_layers=-1 (todas=36): ~42.5 tok/s, fin de voz->1er audio ~1.1s, VRAM ~3.9/4.0GB (margen ~0.2GB, arriesgado)
# El 7B con gpu_layers=-1 NO entra en 4GB: el driver empieza a spillear a RAM compartida y todo se
# vuelve más lento (incluso Whisper, que comparte GPU). Por eso el default sigue siendo el 3B.
repo = "bartowski/Qwen2.5-3B-Instruct-GGUF"
file = "Qwen2.5-3B-Instruct-Q4_K_M.gguf"
n_ctx = 4096                # total, repartido en 2 slots de 2048 (ver server_* abajo)
n_threads = 6              # solo importa para las capas que queden en CPU
n_gpu_layers = 28          # subir a -1 si nada más usa la GPU y querés el máximo; bajar si ves OOM
max_tokens = 200
temperature = 0.0          # greedy/determinístico. Con >0 la misma conversación podía dar resultados
                            # distintos entre corridas (ver tests/eval_questions.yaml); con 0 se puede
                            # comparar de verdad si un cambio arregló algo, sin ruido de muestreo
# LLM como subproceso llama-server (no embebido) -- ver voice/llm.py y README. server_bin apunta al
# binario compilado con CUDA en /home/pbdev/llama.cpp/build-cuda (build propio de esta máquina, no
# viene con el repo: ver README para compilarlo).
server_bin = "/home/pbdev/llama.cpp/build-cuda/bin/llama-server"
server_host = "127.0.0.1"
server_port = 8811
# El LLM de respuesta YA NO recibe el historial de la charla (ver [rewrite] y voice/rewrite.py): recibe
# la pregunta ya reescrita como autónoma + el CONTEXTO de este turno, nada más. Antes el system_prompt
# tenía una regla de "priorizá el CONTEXTO sobre lo que dijiste antes" -- ya no aplica, no hay "antes".
system_prompt = """Eres un asistente de voz local. Respondés siempre en español, en 1 a 3 frases cortas y naturales, como si hablaras en voz alta.
No uses markdown, listas, emojis ni símbolos. Escribí los números y unidades como se pronuncian.
La pregunta que recibís ya viene formulada como autónoma, sin depender de una charla previa.
Antes de usar el CONTEXTO, fijate si realmente tiene que ver con la pregunta. Si tiene que ver, úsalo
para responder y no inventes datos (horarios, precios, nombres) que no estén ahí; si no contiene la
respuesta, decilo con honestidad. Si el CONTEXTO no tiene que ver con la pregunta, ignoralo por
completo y respondé como asistente general, sin forzarlo ni mencionarlo."""

[rewrite]
# Reescribe la pregunta en una autónoma ANTES del retrieval (reemplaza al viejo fallback de
# "sticky hits"). Ver voice/rewrite.py y README. Usa el mismo LLM (Qwen2.5-3B), una llamada extra
# por turno -- CORRE SIEMPRE (25/09, ver README "sujeto omitido"), incluso en una pregunta simple,
# bien formada, de primer turno, sin historial: el bug real que motivó esto es que una pregunta
# como "¿A qué hora abre el martes?" (sujeto omitido, sin decir "la oficina") ya viene con "?" y
# sin historial de dónde completar el sujeto -- antes de esto, eso hacía que se saltee la
# reescritura por completo y el retrieval fallara por falta del sujeto, no por "martes". Único caso
# que sigue sin pagarla: charla social reconocida (guardrails.is_chitchat) -- no hay nada que
# completar ahí, y sería latencia pura sin beneficio.
enabled = true
history_turns = 2          # últimos N turnos (usuario+asistente) que ve el reescritor
max_tokens = 40             # una pregunta reescrita es corta; esto es tope, no objetivo
# Sujeto por defecto para completar preguntas que lo omiten (ver voice/rewrite.py: SYSTEM_PROMPT,
# instrucción de sujeto omitido) -- NO hardcodeado en el prompt, se inyecta desde acá. Cambiar si
# el sujeto genérico del negocio no es "la oficina" (p.ej. "el local", "la clínica").
default_subject = "la oficina"

[canonical]
# Respuestas canónicas (FAQ con texto fijo, redactado por la empresa) -- ver voice/canonical.py y
# README. Se evalúan ANTES del RAG, por (sub)pregunta: si el reranker matchea alguna formulación
# por encima de threshold, se responde con el texto tal cual, sin llamar al LLM.
enabled = true
path = "tests/canonical_answers.yaml"   # PROVISORIO -- contenido inventado, reemplazar cuando
                                         # exista el contenido real de la empresa (mismo formato)
reranker_model = "jinaai/jina-reranker-v2-base-multilingual"  # mismo modelo que rag.reranker_model
# PROVISORIO, atado al contenido de path de arriba -- ver README "parámetros calibrados vs.
# arquitectura estable". Como con rag.min_score/ambiguity_threshold, es solo el FALLBACK: si existe
# calibration.toml (generado por `python scripts/calibrate.py`) lo pisa.
threshold = 2.0

[tts]
voice = "es_AR-daniela-high"
voices_dir = "models/piper"
length_scale = 1.0         # >1 = más lento
